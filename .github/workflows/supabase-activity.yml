name: Supabase activity

on:
  schedule:
    # 09:00 and 21:00 KST. A few Postgres writes per day is what Supabase counts as activity.
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write isolated database activity
        run: |
          curl --fail-with-body \
            --retry 4 \
            --retry-delay 20 \
            --retry-all-errors \
            --max-time 180 \
            -X POST \
            -H 'Content-Type: application/json' \
            https://love-alarm-server.onrender.com/internal/db-activity
