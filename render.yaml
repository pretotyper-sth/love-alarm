services:
  - type: web
    name: love-alarm-server
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma db push --accept-data-loss && node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: RENDER_EXTERNAL_URL
        value: https://love-alarm-server.onrender.com
      # Free 750h/월 소진 방지: keep-alive 기본 OFF. 유료 플랜에서만 ENABLE_KEEP_ALIVE=1
      - key: ENABLE_KEEP_ALIVE
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
      - key: INSTAGRAM_WEBHOOK_DEBUG
        value: "0"
      - key: TOSS_CLIENT_CERT_BASE64
        sync: false
      - key: TOSS_CLIENT_KEY_BASE64
        sync: false
      - key: TOSS_DECRYPTION_KEY
        sync: false
      - key: TOSS_AAD
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
